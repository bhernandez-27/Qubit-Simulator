<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloch Sphere</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body 
        {
            margin: 0;
            padding: 0;
        }
    </style>   
</head>
<body>
    <div id="ui-container" style=
    "
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        display: flex;
        flex-direction: row;
        padding: 0px;
        gap: 0px; /* automatic spacing between children — no manual top/left needed! */
    ">
        <div id="leftHandNavigation" style="background-color: gray; width: 23%; height: 100%; overflow: auto; max-width: 80%; padding-left: 1.5%;">
            <div>
                <h1 style = "color : white; text-shadow : 2px 1px rgb(61, 8, 61);"> Plot a Qubit </h1>
            </div>
            <div id="plottingInput" style="z-index: 10; color: white; font-family: sans-serif">
                <span id="alphaInputContainer" style="display: inline-block;"></span>
                <p style="display: inline-block; font-size: 200%;"> \(\vert0\rangle\) </p>
                <p style="display: inline-block; font-size: 200%;"> + </p>
                <span id="betaInputContainer" style="display: inline-block;"></span>
                <p style="display: inline-block; font-size: 200%;">\(\vert 1 \rangle\)</p>

                <br>
                <button id="plotButton" style="width: 150px; height: 50px;">Plot</button>
            </div>

            <p id="errorMessage"></p>


            <div id = "rotationDiv">
                <h1 style = "color : rgb(49, 7, 49); text-shadow: 1px 1px white;">Rotate the Qubit</h1>
                <span id="rotationContainer" style="display: inline-block;"></span>
                <button id="rotateButton" style="width: 150px; height: 50px;">Rotate Qubit</button>
            </div>

            <h3>Default Rotations</h3>
            <div id = "defaultMatrices">
                <button id = "XMatrix" style = "height: 50px; width: 15%;">X</button>
                <button id = "YMatrix" style = "height: 50px; width: 15%;">Y</button>
                <button id = "ZMatrix" style = "height: 50px; width: 15%;">Z</button>
                <button id = "HMatrix" style = "height: 50px; width: 15%;">H</button>
                <button id = "QMatrix" style = "height: 50px; width: 15%;">Q</button>
            </div>

            <br>

            <div id="ui-overlay" style="z-index: 5; color: white; font-family: sans-serif;">
                <div>Number of Segments</div>
                <input type="range" id="sphereSegmentsSlider" min="1" max="400" value="13">
                <span id="sphereSegmentsValue">13</span>
            </div>


            
            <script type="module" src="/src/main.ts"></script>
        </div>

        <div id="resizeHandle" style="width: 6px; height: 100%; cursor: ew-resize; background: #444; pointer-events: auto;"></div>


        <div id="sceneContainer" style="position: relative; flex: 1; overflow: auto; min-width: 20%;"></div>
    
    </div>

</body>
</html>
